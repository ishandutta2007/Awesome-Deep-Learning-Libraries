<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1629" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .pulse-circle {
        animation: pulse 3s infinite ease-in-out;
      }
      .floating-node {
        animation: float 6s infinite ease-in-out;
      }
      .dash-flow {
        stroke-dasharray: 6 6;
        animation: flow 20s linear infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes flow {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Animated Ambient Glowing Orbs in the background -->
  <g opacity="0.3">
    <circle cx="950" cy="90" r="140" fill="#6366f1" filter="url(#glow)" class="pulse-circle" style="transform-origin: 950px 90px;" />
    <circle cx="200" cy="280" r="100" fill="#0284c7" filter="url(#glow)" class="pulse-circle" style="transform-origin: 200px 280px; animation-delay: 1.5s;" />
    <circle cx="1100" cy="290" r="120" fill="#a855f7" filter="url(#glow)" class="pulse-circle" style="transform-origin: 1100px 290px; animation-delay: 1s;" />
  </g>

  <!-- Dynamic Animated Neural Network Connections (Background Flow) -->
  <g stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5" class="dash-flow" fill="none">
    <path d="M 800 60 Q 920 120 1060 90" />
    <path d="M 750 180 Q 900 150 1020 220" />
    <path d="M 860 270 Q 980 200 1120 260" />
    <path d="M 920 120 L 1020 220" />
    <path d="M 800 60 L 750 180 L 860 270" />
    <path d="M 1060 90 L 1020 220 L 1120 260" />
  </g>

  <!-- Neural Nodes (Animated Floating Elements in background / right side) -->
  <g class="floating-node">
    <circle cx="800" cy="60" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="920" cy="120" r="8" fill="#818cf8" filter="url(#glow)" />
    <circle cx="1060" cy="90" r="7" fill="#c084fc" filter="url(#glow)" />
    <circle cx="750" cy="180" r="7" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1020" cy="220" r="9" fill="#818cf8" filter="url(#glow)" />
    <circle cx="860" cy="270" r="7" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1120" cy="260" r="6" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Foreground Content: Pill Tag -->
  <g transform="translate(80, 52)">
    <rect width="210" height="32" rx="16" fill="url(#badgeGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="21" class="tag-text">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Foreground Title and Gradient Accent Bar -->
  <g transform="translate(80, 140)">
    <rect x="0" y="-36" width="6" height="52" rx="3" fill="url(#glowGrad)" />
    <text x="24" y="0" class="title-text">Awesome Deep Learning Libraries</text>
  </g>

  <!-- Foreground Subtitle -->
  <text x="104" y="185" class="sub-text">Architectures, Frameworks &amp; Managed Accelerators for Neural Networks</text>
  <text x="104" y="214" class="sub-text" style="font-size: 15px; fill: #64748b;">PyTorch • TensorFlow • Keras 3 • JAX • DeepSpeed • Transformers • Cloud MLOps</text>

  <!-- Interactive/Dynamic Feature Chips in Foreground Bottom -->
  <g transform="translate(104, 255)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ High-Level APIs</text>
    </g>

    <!-- Chip 2 -->
    <g transform="translate(200, 0)">
      <rect width="195" height="42" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔄 Multi-Backend JIT</text>
    </g>

    <!-- Chip 3 -->
    <g transform="translate(415, 0)">
      <rect width="215" height="42" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚀 Distributed Training</text>
    </g>
  </g>
</svg>
